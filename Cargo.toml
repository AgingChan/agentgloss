[package]
name = "agentgloss"
version = "1.0.3"
edition = "2024"
description = "A terminal reviewer for long Markdown specs and agent-generated plans"
license = "MIT"
repository = "https://github.com/AgingChan/agentgloss"
readme = "README.md"
keywords = ["markdown", "tui", "review", "agents", "spec"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
exclude = [
    ".cargo/**",
    ".claude/**",
    ".github/**",
    ".superpowers/**",
    "docs/**",
    "harness/**",
    "init.sh",
    "scripts/**",
    "specs/**",
    "state/**",
    "vscode/**",
    "branding/**",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
edtui = { version = "0.11.8", default-features = false, features = ["mouse-support"] }
fontdb = "0.24.0"
fs2 = "0.4.3"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
resvg = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.3.18"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tiny-skia = "0.12.0"
toml = "1.2.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
usvg = "0.50.0"

[dev-dependencies]
tempfile = "3.27.0"
